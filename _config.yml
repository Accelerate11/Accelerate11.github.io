# 姜云泽的个人主页。修改后重新构建即可生效。
locale: "zh-CN"
site_theme: "default"
title: "姜云泽 | Yunze Jiang"
title_separator: "·"
name: "姜云泽"
description: "姜云泽（accelerate），哈尔滨工业大学机器人工程本科生。关注无人机自主导航避障、人工智能、机器人与嵌入式系统。"
url: "https://accelerate11.github.io"
baseurl: ""
repository: "Accelerate11/Accelerate11.github.io"
timezone: "Asia/Shanghai"
author:
  name: "姜云泽"
  name_en: "Yunze Jiang"
  avatar: "github-avatar.jpg"
  handle: "accelerate"
  bio: "机器人与嵌入式系统开发"
  employer: "哈尔滨工业大学"
  education: "本科 · 机器人工程专业"
  location: "中国 · 哈尔滨"
  email: "3062811267@qq.com"
  github: "Accelerate11"
  cv: "/files/Yunze-Jiang-CV-public.pdf"
social:
  type: "Person"
  name: "Yunze Jiang / 姜云泽"
  links: ["https://github.com/Accelerate11"]
og_image: "github-avatar.jpg"
og_description: "无人机自主导航避障 · 人工智能 · 机器人与嵌入式系统"
breadcrumbs: false
future: false
read_more: "disabled"
comments:
  provider: false
analytics:
  provider: false
atom_feed:
  hide: true
include: [_pages, files]
exclude:
  - images/profile.jpg
  - files/Yunze-Jiang-CV.pdf
  - .bundle
  - .github
  - .openai
  - .jekyll-cache
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - README.md
  - UPLOAD-GUIDE.md
  - CONTENT-SOURCES.md
  - AGENTS.md
  - LICENSE
  - docs
  - scripts
  - vendor
  - node_modules
  - package.json
  - tmp
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..3
collections:
  portfolio:
    output: true
    permalink: /projects/:path/
  publications:
    output: true
    permalink: /publications/:path/
defaults:
  - scope:
      path: ""
    values:
      layout: profile
      author_profile: true
      comments: false
      share: false
sass:
  sass_dir: _sass
  style: compressed
plugins: [jekyll-feed, jekyll-sitemap, jekyll-redirect-from, jekyll-gist, jekyll-paginate, jemoji]
compress_html:
  clippings: all
  ignore:
    envs: development
