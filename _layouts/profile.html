---
layout: default
---
<div id="main" class="profile-layout">
  {% include sidebar.html %}
  <main id="main-content" class="page profile-page" tabindex="-1">
    {% if page.eyebrow %}<p class="page-eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page__title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    <div class="page__content">{{ content }}</div>
  </main>
</div>
